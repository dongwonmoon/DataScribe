<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Schema Scribe Demo</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; background: #f5f5f7; color: #1d1d1f; }
    header { background: #fff; padding: 16px 24px; border-bottom: 1px solid #e5e5ea; }
    header h1 { margin: 0; font-size: 20px; }
    main { padding: 24px; max-width: 960px; margin: 0 auto; }
    section { background: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px;
              box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h2 { font-size: 16px; margin-top: 0; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, button { font-size: 14px; padding: 6px 12px; border-radius: 8px; border: 1px solid #d1d1d6; }
    button { background: #0071e3; color: #fff; border: none; cursor: pointer; }
    button:disabled { background: #a9a9ad; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #eee; }
    th { background: #fafafa; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.pending { background: #fff3cd; color: #856404; }
    .badge.running { background: #cce5ff; color: #004085; }
    .badge.succeeded { background: #d4edda; color: #155724; }
    .badge.failed { background: #f8d7da; color: #721c24; }
    .metric { color: #555; font-size: 12px; }
    pre { background: #f5f5f7; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
    .catalog-table { margin-top: 12px; }
    .status { color: #666; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <header><h1>✍️ Schema Scribe — Thin Hosted Demo</h1></header>
  <main>
    <section>
      <h2>🚀 Submit a scan</h2>
      <div class="row">
        <select id="profile"></select>
        <button id="submit" onclick="submitJob()">Scan database</button>
      </div>
      <div class="status" id="submit-status"></div>
    </section>

    <section>
      <h2>📋 Job board <span class="metric">(polls every 1s while active)</span></h2>
      <table>
        <thead><tr><th>Job</th><th>Status</th><th>Timing (submitted → done)</th><th>Engine metrics</th></tr></thead>
        <tbody id="jobs"></tbody>
      </table>
      <div class="status" id="queue-status"></div>
    </section>

    <section>
      <h2>📁 Latest catalog</h2>
      <div id="catalog"></div>
    </section>
  </main>

  <script>
    let pollTimer = null;

    async function api(path, opts) {
      const r = await fetch(path, opts);
      if (!r.ok) {
        const body = await r.json().catch(() => ({}));
        throw new Error((body.detail && body.detail.error && body.detail.error.message) || r.statusText);
      }
      return r.json();
    }

    async function loadProfiles() {
      try {
        const data = await api('/api/profiles');
        const sel = document.getElementById('profile');
        const names = (data.db_connections || []).filter(n => typeof n === 'string');
        sel.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('') || '<option>—</option>';
      } catch (e) {
        document.getElementById('submit-status').textContent = 'profiles: ' + e.message;
      }
    }

    async function submitJob() {
      const profile = document.getElementById('profile').value;
      const btn = document.getElementById('submit');
      btn.disabled = true;
      document.getElementById('submit-status').textContent = 'submitting…';
      try {
        const r = await api('/api/jobs', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({db_profile: profile}),
        });
        document.getElementById('submit-status').textContent = `submitted ${r.job_id}`;
        startPolling();
      } catch (e) {
        document.getElementById('submit-status').textContent = 'error: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    function startPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(refreshBoard, 1000);
      refreshBoard();
    }

    async function refreshBoard() {
      try {
        const data = await api('/api/jobs');
        const tbody = document.getElementById('jobs');
        tbody.innerHTML = data.jobs.map(j => {
          const timing = j.finished_at
            ? ((j.finished_at - j.submitted_at) * 1000).toFixed(0) + ' ms'
            : j.started_at ? 'running…' : 'queued';
          const m = j.metrics
            ? `queries=${j.metrics.db_queries} llm=${j.metrics.llm_calls} engine=${j.metrics.engine_ms}ms`
            : j.error ? `failed: ${j.error}` : '—';
          return `<tr><td><code>${j.job_id}</code></td>
                  <td><span class="badge ${j.status}">${j.status}</span></td>
                  <td>${timing}</td><td class="metric">${m}</td></tr>`;
        }).join('');
        const active = data.jobs.filter(j => j.status === 'pending' || j.status === 'running').length;
        document.getElementById('queue-status').textContent = active
          ? `${active} active job(s)…` : '';
        const done = data.jobs.find(j => j.status === 'succeeded' && j.has_catalog);
        const catalogEl = document.getElementById('catalog');
        if (done && done.job_id !== catalogEl.dataset.jobId) {
          // The board list carries has_catalog only; fetch the full job
          // state (which includes the catalog payload) before rendering.
          api(`/api/jobs/${done.job_id}`).then(job => renderCatalog(job));
        }
        if (!active) stopPolling();
      } catch (e) { /* transient */ }
    }

    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    function renderCatalog(job) {
      const el = document.getElementById('catalog');
      el.dataset.jobId = job.job_id;
      const c = job.catalog;
      let html = `<div class="status">from job <code>${job.job_id}</code></div>`;
      html += `<h3>Scale: ${c.tables ? c.tables.length : 0} tables</h3>`;
      for (const table of (c.tables || [])) {
        html += `<h4>📄 ${table.name}</h4>`;
        if (table.ai_summary) html += `<p class="metric">${table.ai_summary}</p>`;
        html += `<table class="catalog-table"><thead><tr><th>Column</th><th>Type</th><th>Description</th></tr></thead><tbody>`;
        for (const col of (table.columns || [])) {
          html += `<tr><td>${col.is_pk ? '🔑 ' : ''}${col.name}</td><td>${col.type}</td><td>${col.description || '—'}</td></tr>`;
        }
        html += '</tbody></table>';
      }
      if (c.foreign_keys && c.foreign_keys.length) {
        html += `<h4>🔗 Relationships</h4><ul class="metric">`;
        for (const fk of c.foreign_keys) {
          html += `<li>${fk.source_table}.${fk.source_column} → ${fk.target_table}.${fk.target_column}</li>`;
        }
        html += '</ul>';
      }
      el.innerHTML = html;
    }

    loadProfiles();
    refreshBoard();
  </script>
</body>
</html>

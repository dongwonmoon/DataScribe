name: docs-check

# LLM-free documentation gates: db --check (structural schema drift vs the
# committed baseline sidecar) and db --drift would be LLM-free too — the
# profile-drift gate is deferred (see docs/superpowers/plans/
# 2026-08-11-phase2-drift-and-change-checks.md Task 3). The baseline
# sidecar is written by one generation run and committed; these steps
# never call an LLM.
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e '.[all]'
      - name: Structural docs gate (no LLM)
        run: |
          schema-scribe db --db fixture --output md --check || exit 1

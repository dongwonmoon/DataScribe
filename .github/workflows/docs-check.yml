name: docs-check

# LLM-free documentation gate: db --check (structural schema drift vs the
# COMMITTED baseline in ci/). The baseline (ci/fixture.db + ci/catalog.md
# + ci/catalog.md.schema-state.json) is deterministic — generated once with
# a stub LLM, committed, and verified by this gate on every push. The gate
# never calls an LLM (2026-08-11, Phase 2).
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e '.[all]'
      - name: Structural docs gate (no LLM)
        run: |
          schema-scribe db --config ci/config.ci.yaml --db fixture --output md --check
